name: Deploy Hexo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Matery theme
        run: |
          git clone --depth 1 https://github.com/blinkfox/hexo-theme-matery.git themes/matery
          cp theme-overrides/matery/_config.yml themes/matery/_config.yml
          rm -f themes/matery/source/medias/reward/wechat.png themes/matery/source/medias/reward/alipay.jpg
          mkdir -p themes/matery/layout/_partial
          cp theme-overrides/matery/layout/_partial/footer.ejs themes/matery/layout/_partial/footer.ejs
          mkdir -p themes/matery/layout/_widget themes/matery/source/css
          cp theme-overrides/matery/layout/layout.ejs themes/matery/layout/layout.ejs
          cp theme-overrides/matery/layout/index.ejs themes/matery/layout/index.ejs
          cp theme-overrides/matery/layout/_widget/site-stats.ejs themes/matery/layout/_widget/site-stats.ejs
          cp theme-overrides/matery/source/css/my.css themes/matery/source/css/my.css

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Hexo site
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
